<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponto Lanchonete</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2620">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1E2620;--surface:#262F27;--surface-2:#313B30;--line:#3C463B;--text:#F3EEE2;--text-muted:#9CA692;
    --mustard:#D2A234;--sage:#8FAE86;--rust:#BD6A3E;--info:#7FA6C9;--danger:#C9666B;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font-family:'Work Sans',system-ui,sans-serif; }
  body { display:flex; justify-content:center; padding:32px 16px 48px; }
  .board { width:100%; max-width:520px; }
  header { text-align:center; margin-bottom:22px; }
  .logo { display:block; margin:0 auto 10px; width:72px; height:72px; border-radius:16px; }
  h1 { font-family:'Oswald',sans-serif; font-weight:700; font-size:30px; letter-spacing:.5px; margin:0 0 4px; }
  .subtitle { font-size:14px; color:var(--text-muted); }
  .add-row { display:flex; gap:8px; margin-bottom:16px; }
  input[type="text"], input[type="date"] {
    background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px 14px;
    color:var(--text); font-family:'Work Sans',sans-serif; font-size:15px; outline:none; min-width:0; width:100%;
  }
  .add-row input[type="text"] { flex:1; width:auto; }
  input:focus { border-color:var(--mustard); }
  input::placeholder { color:var(--text-muted); }
  input[type="date"] { color-scheme:dark; }
  button { font-family:'Work Sans',sans-serif; font-weight:600; font-size:14px; border:none; border-radius:6px; padding:12px 16px; cursor:pointer; white-space:nowrap; }
  .btn-add { background:var(--mustard); color:#1E2620; }
  .btn-add:hover { filter:brightness(1.08); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .stat-card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 8px; text-align:center; }
  .stat-card .value { font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; color:var(--mustard); }
  .stat-card .label { font-size:10.5px; color:var(--text-muted); margin-top:2px; line-height:1.2; }
  .action-bar { display:flex; gap:8px; margin-bottom:16px; }
  .filter-bar { position:relative; flex:1; min-width:0; }
  .btn-filter { display:flex; align-items:center; gap:8px; background:var(--surface); color:var(--text); border:1px solid var(--line); width:100%; justify-content:space-between; }
  .btn-filter:hover { border-color:var(--mustard); }
  .btn-filter .count { background:var(--mustard); color:#1E2620; border-radius:999px; font-size:11px; padding:2px 7px; font-weight:700; }
  .filter-panel { display:none; position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px; z-index:10; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .filter-panel.open { display:block; }
  .filter-group { margin-bottom:14px; }
  .filter-group:last-child { margin-bottom:0; }
  .filter-group-label { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:8px; display:block; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; }
  .filter-btn { background:var(--surface-2); color:var(--text-muted); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; flex-shrink:0; }
  .filter-btn:hover { color:var(--text); }
  .filter-btn.active { background:var(--mustard); color:#1E2620; border-color:var(--mustard); font-weight:600; }
  .filter-date-row { display:flex; align-items:center; gap:8px; }
  .link-clear { background:transparent; color:var(--text-muted); font-size:12px; text-decoration:underline; padding:4px 2px; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .ticket { background:var(--surface); border-radius:4px; border-left:4px solid var(--line); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .ticket.pending { border-left-color:var(--mustard); }
  .ticket.confirming { border-left-color:var(--rust); background:var(--surface-2); }
  .ticket.clocked-in { border-left-color:var(--info); }
  .ticket.done { border-left-color:var(--sage); }
  .ticket .name { font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; }
  .ticket .meta { font-size:13px; color:var(--text-muted); margin-top:2px; }
  .ticket .left { min-width:0; }
  .status-pending { font-size:13px; color:var(--text-muted); }
  .btn-confirm { background:transparent; color:var(--mustard); border:1px solid var(--mustard); }
  .btn-out { background:transparent; color:var(--info); border:1px solid var(--info); }
  .confirming-form, .editing-form { display:flex; flex-wrap:wrap; gap:8px; width:100%; margin-top:4px; }
  .btn-register { background:var(--rust); color:#1E2620; }
  .btn-cancel { background:transparent; color:var(--text-muted); font-size:13px; padding:4px 6px; text-decoration:underline; }
  .done-badge { font-size:14px; color:var(--sage); font-weight:600; }
  .done-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .remove-link, .edit-link { background:transparent; font-size:12px; padding:4px 2px; text-decoration:underline; }
  .remove-link { color:var(--text-muted); }
  .edit-link { color:var(--sage); }
  .editing-form input { flex:1; min-width:90px; }
  .editing-form .field-label { font-size:11px; color:var(--text-muted); margin-bottom:3px; display:block; }
  .editing-form .field { display:flex; flex-direction:column; flex:1; min-width:90px; }
  .editing-form .form-actions { display:flex; gap:8px; width:100%; }
  .btn-save { background:var(--sage); color:#1E2620; }
  .empty { text-align:center; color:var(--text-muted); font-size:14px; padding:40px 12px; border:1px dashed var(--line); border-radius:6px; }
  .tipo-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.4px; padding:2px 6px; border-radius:4px; margin-right:6px; font-weight:700; }
  .tipo-badge.tenda { background:rgba(143,174,134,.18); color:var(--sage); }
  .tipo-badge.parceiro { background:rgba(127,166,201,.18); color:var(--info); }
  .tipo-choice-row { display:flex; gap:8px; width:100%; margin-top:4px; }
  .tipo-choice-row button { flex:1; background:var(--surface); color:var(--text); border:1px solid var(--line); }
  .tipo-choice-row button:hover { border-color:var(--mustard); color:var(--mustard); }
  .mode-switch { position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; font-size:12px; color:var(--text-muted); text-decoration:underline; background:transparent; border:none; cursor:pointer; padding:6px; }
  .install-btn { display:none; position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:12px; font-size:12px; font-weight:700; background:var(--mustard); color:#1E2620; border:none; border-radius:6px; padding:8px 12px; cursor:pointer; z-index:20; }
  .kiosk { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:55vh; gap:18px; text-align:center; }
  .kiosk-sub { color:var(--text-muted); font-size:15px; }
  .kiosk-choices { display:flex; gap:14px; width:100%; max-width:380px; }
  .kiosk-choice { flex:1; padding:30px 10px; font-size:18px; font-weight:700; font-family:'Oswald',sans-serif; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:10px; }
  .kiosk-choice:hover { border-color:var(--mustard); color:var(--mustard); }
  .kiosk-form { display:flex; flex-direction:column; gap:10px; width:100%; max-width:380px; }
  .kiosk-form .btn-add, .kiosk .btn-add { width:100%; }
</style>
</head>
<body>
<button class="mode-switch" id="mode-switch" type="button">Área administrativa</button>
<button class="install-btn" id="install-btn" type="button">📲 Instalar app</button>
<div class="board">

  <div id="view-usuario">
    <header><img class="logo" src="logo-tenda.png" alt="Tenda Atacado" width="72" height="72"><h1>Ponto Lanchonete</h1><div class="subtitle" id="subtitle-u"></div></header>
    <div class="kiosk" id="kiosk"></div>
  </div>

  <div id="view-admin" style="display:none;">
    <header><img class="logo" src="logo-tenda.png" alt="Tenda Atacado" width="72" height="72"><h1>Ponto Lanchonete</h1><div class="subtitle" id="subtitle-a"></div></header>
    <div class="add-row">
      <input type="text" id="new-name" placeholder="Nome do funcionário" maxlength="60">
      <button class="btn-add" id="add-btn">Adicionar</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="action-bar">
      <div class="filter-bar">
        <button class="btn-filter" id="filter-toggle" type="button"><span>🔎 Filtrar</span><span class="count" id="filter-count" style="display:none;"></span></button>
        <div class="filter-panel" id="filter-panel">
          <div class="filter-group"><span class="filter-group-label">Buscar</span><input type="text" id="search-input" placeholder="Nome, matrícula, empresa ou CPF"></div>
          <div class="filter-group"><span class="filter-group-label">Tipo</span>
            <div class="filters" id="tipo-filters">
              <button class="filter-btn active" data-tipofilter="all" type="button">Todos</button>
              <button class="filter-btn" data-tipofilter="tenda" type="button">Tenda</button>
              <button class="filter-btn" data-tipofilter="parceiro" type="button">Parceiro</button>
            </div>
          </div>
          <div class="filter-group"><span class="filter-group-label">Status</span>
            <div class="filters" id="filters">
              <button class="filter-btn active" data-filter="all" type="button">Todos</button>
              <button class="filter-btn" data-filter="pending" type="button">Pendentes</button>
              <button class="filter-btn" data-filter="clocked-in" type="button">Aguardando saída</button>
              <button class="filter-btn" data-filter="done" type="button">Concluídos</button>
            </div>
          </div>
          <div class="filter-group"><span class="filter-group-label">Período</span>
            <div class="filters" id="period-filters" style="margin-bottom:8px;">
              <button class="filter-btn active" data-period="all" type="button">Todo período</button>
              <button class="filter-btn" data-period="week" type="button">Esta semana</button>
              <button class="filter-btn" data-period="month" type="button">Este mês</button>
            </div>
            <div class="filter-date-row"><input type="date" id="date-input"><button class="link-clear" id="date-clear" type="button">limpar data</button></div>
          </div>
        </div>
      </div>
      <div class="filter-bar">
        <button class="btn-filter" id="download-toggle" type="button"><span>⬇️ Baixar lista</span></button>
        <div class="filter-panel" id="download-panel">
          <div class="filter-group"><span class="filter-group-label">Escolha o dia</span><input type="date" id="download-date-input"></div>
          <button class="btn-add" id="download-confirm" type="button" style="width:100%;">Baixar CSV</button>
        </div>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>

</div>

<script>
(function () {
  var STORAGE_KEY = 'ponto-do-turno-state';
  var state = { employees: [], nextId: 1 };
  var appMode = 'user';
  var filter = 'all', periodFilter = 'all', specificDate = '', search = '', tipoFilter = 'all';
  var kioskState = { step: 'type', tipo: null, msg: '' };

  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      state.employees = parsed.employees || [];
      state.nextId = parsed.nextId || 1;
    }
  } catch (e) {}

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function timeNow() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dateISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return dateISO(new Date()); }
  function parseISO(s) { var p = s.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
  function isThisWeek(s) { if (!s) return true; var d = parseISO(s), now = new Date(); var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()); var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7); return d >= start && d < end; }
  function isThisMonth(s) { if (!s) return true; var d = parseISO(s), now = new Date(); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }
  function isValidTime(t) { return /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(t); }
  function dateLabel() {
    var d = new Date();
    var dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    var meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return dias[d.getDay()] + ', ' + d.getDate() + ' de ' + meses[d.getMonth()];
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function maskCPF(v) {
    v = v.replace(/\D/g, '').slice(0, 11);
    if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
    else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
    return v;
  }
  function validCPF(v) { var d = String(v || '').replace(/\D/g, ''); return d.length === 11 && !/^(\d)\1{10}$/.test(d); }
  function idLine(emp) {
    if (emp.tipo === 'tenda') return 'Matrícula ' + esc(emp.matricula);
    if (emp.tipo === 'parceiro') return esc(emp.empresa) + ' · CPF ' + esc(emp.cpf);
    return '';
  }
  function tipoBadge(emp) {
    if (!emp.tipo) return '';
    return '<span class="tipo-badge ' + emp.tipo + '">' + (emp.tipo === 'tenda' ? 'Tenda' : 'Parceiro') + '</span>';
  }
  /* ---------- Sincronização com o servidor (Neon) ---------- */
  var SYNC_KEY = 'ponto-do-turno-synced';
  var TRANSIENT = { 'confirming-in': 1, 'confirming-out': 1, 'editing': 1 };
  var synced = {}, syncing = false, syncAgain = false, ver = 0;
  try { synced = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') || {}; } catch (e) {}

  function newId() { return Date.now() * 1000 + Math.floor(Math.random() * 1000); }
  function norm(e) {
    var s = e.status;
    if (s === 'confirming-in') s = 'pending'; else if (s === 'confirming-out') s = 'clocked-in'; else if (s === 'editing') s = 'done';
    return { id: e.id, tipo: e.tipo || null, name: e.name, matricula: e.matricula || '', empresa: e.empresa || '', cpf: e.cpf || '', status: s, entradaTime: e.entradaTime || '', saidaTime: e.saidaTime || '', date: e.date };
  }
  function isDirty(e) { return JSON.stringify(norm(e)) !== synced[e.id]; }
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); localStorage.setItem(SYNC_KEY, JSON.stringify(synced)); } catch (e) {}
  }
  var adminToken = null;
  function api(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'x-admin-token': adminToken || '' });
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { setMode('user'); alert('Sessão expirada. Entre novamente na área administrativa.'); throw new Error('auth'); }
      return r;
    });
  }
  function checkOk(r) { if (!r.ok) throw new Error('http ' + r.status); }

  function sync() {
    if (!adminToken) return;
    if (syncing) { syncAgain = true; return; }
    var ops = [], present = {};
    state.employees.forEach(function (e) {
      present[e.id] = 1;
      var j = JSON.stringify(norm(e));
      if (synced[e.id] !== j) {
        ops.push(api('/api/employees/' + e.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: j })
          .then(checkOk).then(function () { synced[e.id] = j; }));
      }
    });
    Object.keys(synced).forEach(function (id) {
      if (!present[id]) ops.push(api('/api/employees/' + id, { method: 'DELETE' }).then(checkOk).then(function () { delete synced[id]; }));
    });
    if (!ops.length) return;
    syncing = true;
    Promise.all(ops.map(function (p) { return p.catch(function () {}); })).then(function () {
      syncing = false; saveLocal();
      if (syncAgain) { syncAgain = false; sync(); }
    });
  }

  function editingInList() {
    var a = document.activeElement;
    return state.employees.some(function (e) { return TRANSIENT[e.status]; }) || (a && a.closest && a.closest('#list'));
  }

  function pull() {
    if (syncing || !adminToken) return;
    var v = ver;
    api('/api/employees', { cache: 'no-store' }).then(function (r) { checkOk(r); return r.json(); }).then(function (list) {
      if (v !== ver || syncing) return;
      var local = {}, serverIds = {}, next = [];
      state.employees.forEach(function (e) { local[e.id] = e; });
      list.forEach(function (s) {
        serverIds[s.id] = 1;
        var l = local[s.id];
        if (l && (TRANSIENT[l.status] || isDirty(l))) { next.push(l); }
        else { next.push(s); synced[s.id] = JSON.stringify(norm(s)); }
      });
      state.employees.forEach(function (e) {
        if (!serverIds[e.id]) { if (isDirty(e) || TRANSIENT[e.status]) next.push(e); else delete synced[e.id]; }
      });
      next.sort(function (a, b) { return a.id - b.id; });
      var changed = JSON.stringify(next) !== JSON.stringify(state.employees);
      state.employees = next;
      saveLocal();
      if (changed && appMode === 'admin' && !editingInList()) render();
      sync();
    }).catch(function () {});
  }

  function persist() { ver++; saveLocal(); sync(); }

  /* ---------- KIOSK (view Usuário) ---------- */
  function renderKiosk() {
    document.getElementById('subtitle-u').textContent = dateLabel();
    var el = document.getElementById('kiosk');
    if (kioskState.step === 'type') {
      el.innerHTML =
        '<div class="kiosk-sub">Você é:</div>' +
        '<div class="kiosk-choices">' +
          '<button class="kiosk-choice" data-tipo="tenda" type="button">Tenda</button>' +
          '<button class="kiosk-choice" data-tipo="parceiro" type="button">Parceiro</button>' +
        '</div>';
    } else if (kioskState.step === 'form') {
      var fields = kioskState.tipo === 'tenda'
        ? '<input type="text" name="matricula" placeholder="Matrícula" inputmode="numeric" required>'
        : '<input type="text" name="empresa" placeholder="Empresa" required>' +
          '<input type="text" name="cpf" class="cpf-input" placeholder="CPF" inputmode="numeric" maxlength="14" required>';
      el.innerHTML =
        '<div class="kiosk-sub">' + (kioskState.tipo === 'tenda' ? 'Colaborador Tenda' : 'Parceiro') + '</div>' +
        '<form class="kiosk-form" id="kiosk-form">' +
          '<input type="text" name="name" placeholder="Nome completo" maxlength="60" required>' +
          fields +
          '<button type="submit" class="btn-add">Registrar</button>' +
          '<button type="button" class="btn-cancel" id="kiosk-back">voltar</button>' +
        '</form>';
    } else {
      el.innerHTML = '<div class="kiosk-sub done-badge">' + esc(kioskState.msg) + '</div><button class="btn-add" id="kiosk-again" type="button">Registrar próximo</button>';
    }
  }

  document.getElementById('kiosk').addEventListener('click', function (e) {
    var t = e.target.closest('[data-tipo]');
    if (t && kioskState.step === 'type') { kioskState.tipo = t.getAttribute('data-tipo'); kioskState.step = 'form'; renderKiosk(); return; }
    if (e.target.id === 'kiosk-back') { kioskState = { step: 'type', tipo: null, msg: '' }; renderKiosk(); return; }
    if (e.target.id === 'kiosk-again') { kioskState = { step: 'type', tipo: null, msg: '' }; renderKiosk(); return; }
  });

  document.getElementById('kiosk').addEventListener('submit', function (e) {
    var form = e.target.closest('#kiosk-form');
    if (!form) return;
    e.preventDefault();
    var name = form.querySelector('[name="name"]').value.trim();
    if (!name) return;
    var body = { tipo: kioskState.tipo, name: name };
    if (kioskState.tipo === 'tenda') {
      body.matricula = form.querySelector('[name="matricula"]').value.trim();
      if (!body.matricula) return;
    } else {
      body.empresa = form.querySelector('[name="empresa"]').value.trim();
      body.cpf = form.querySelector('[name="cpf"]').value.trim();
      if (!body.empresa || !validCPF(body.cpf)) { alert('Informe a empresa e um CPF válido.'); return; }
    }
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    fetch('/api/kiosk', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (j) { kioskState.msg = j.msg; kioskState.step = 'success'; renderKiosk(); })
      .catch(function () { btn.disabled = false; alert('Não foi possível registrar. Verifique a conexão e tente novamente.'); });
  });

  document.addEventListener('input', function (e) {
    if (e.target.classList && e.target.classList.contains('cpf-input')) e.target.value = maskCPF(e.target.value);
  });

  /* ---------- ADMIN (view Admin) ---------- */
  function matchesFilters(emp) {
    if (tipoFilter !== 'all' && emp.tipo !== tipoFilter) return false;
    if (filter !== 'all') {
      var m = filter === 'pending' ? (emp.status === 'pending' || emp.status === 'confirming-in') :
        filter === 'clocked-in' ? (emp.status === 'clocked-in' || emp.status === 'confirming-out') :
        filter === 'done' ? (emp.status === 'done' || emp.status === 'editing') : true;
      if (!m) return false;
    }
    if (specificDate) { if (emp.date !== specificDate) return false; }
    else { if (periodFilter === 'week' && !isThisWeek(emp.date)) return false; if (periodFilter === 'month' && !isThisMonth(emp.date)) return false; }
    if (search) {
      var q = search.toLowerCase();
      var hit = emp.name.toLowerCase().indexOf(q) !== -1 || (emp.matricula || '').toLowerCase().indexOf(q) !== -1 ||
        (emp.empresa || '').toLowerCase().indexOf(q) !== -1 || (emp.cpf || '').toLowerCase().indexOf(q) !== -1;
      if (!hit) return false;
    }
    return true;
  }
  function computeStats(v) { return { total: v.length, tenda: v.filter(function (e) { return e.tipo === 'tenda'; }).length, parceiro: v.filter(function (e) { return e.tipo === 'parceiro'; }).length }; }
  function renderStatsHTML(s) {
    return '<div class="stat-card"><div class="value">' + s.total + '</div><div class="label">Registros</div></div>' +
      '<div class="stat-card"><div class="value">' + s.tenda + '</div><div class="label">Tenda</div></div>' +
      '<div class="stat-card"><div class="value">' + s.parceiro + '</div><div class="label">Parceiro</div></div>';
  }

  function tipoChoiceHTML(id) {
    return '<div class="tipo-choice-row">' +
      '<button data-action="set-tipo" data-tipo="tenda" data-id="' + id + '" type="button">Tenda</button>' +
      '<button data-action="set-tipo" data-tipo="parceiro" data-id="' + id + '" type="button">Parceiro</button>' +
    '</div>';
  }
  function registerFieldsHTML(tipo) {
    return tipo === 'tenda'
      ? '<input type="text" name="matricula" placeholder="Matrícula" inputmode="numeric" autofocus>'
      : '<input type="text" name="empresa" placeholder="Empresa" autofocus>' +
        '<input type="text" name="cpf" class="cpf-input" placeholder="CPF" inputmode="numeric" maxlength="14">';
  }

  function renderListHTML(visible) {
    if (!state.employees.length) return '<div class="empty">Nenhum funcionário na lista ainda.<br>Adicione o primeiro acima para começar o turno.</div>';
    if (!visible.length) return '<div class="empty">Nenhum registro nesse filtro.</div>';
    return visible.map(function (emp) {
      if (emp.status === 'editing') {
        return '<div class="ticket confirming" data-id="' + emp.id + '">' +
          '<div class="left"><div class="name">' + tipoBadge(emp) + esc(emp.name) + '</div><div class="meta">Editando registro</div></div>' +
          '<form class="editing-form" data-action="save-edit" data-id="' + emp.id + '">' +
            '<div class="field"><span class="field-label">Nome</span><input type="text" name="name" value="' + esc(emp.name) + '" maxlength="60"></div>' +
            (emp.tipo === 'tenda'
              ? '<div class="field"><span class="field-label">Matrícula</span><input type="text" name="matricula" value="' + esc(emp.matricula) + '" inputmode="numeric"></div>'
              : '<div class="field"><span class="field-label">Empresa</span><input type="text" name="empresa" value="' + esc(emp.empresa) + '"></div>' +
                '<div class="field"><span class="field-label">CPF</span><input type="text" name="cpf" class="cpf-input" value="' + esc(emp.cpf) + '" inputmode="numeric" maxlength="14"></div>') +
            '<div class="field"><span class="field-label">Entrada</span><input type="text" name="entradaTime" value="' + esc(emp.entradaTime) + '" placeholder="HH:MM"></div>' +
            '<div class="field"><span class="field-label">Saída</span><input type="text" name="saidaTime" value="' + esc(emp.saidaTime) + '" placeholder="HH:MM"></div>' +
            '<div class="form-actions"><button type="submit" class="btn-save">Salvar</button><button type="button" class="btn-cancel" data-action="cancel-edit" data-id="' + emp.id + '">cancelar</button></div>' +
          '</form></div>';
      }
      if (emp.status === 'done') {
        return '<div class="ticket done" data-id="' + emp.id + '">' +
          '<div class="left"><div class="name">' + tipoBadge(emp) + esc(emp.name) + '</div>' +
          '<div class="meta">' + idLine(emp) + '</div>' +
          '<div class="meta">Entrada ' + emp.entradaTime + ' · Saída ' + emp.saidaTime + '</div></div>' +
          '<div class="done-actions"><div class="done-badge">✓ Turno concluído</div>' +
          '<button class="edit-link" data-action="edit" data-id="' + emp.id + '" type="button">editar</button>' +
          '<button class="remove-link" data-action="remove" data-id="' + emp.id + '" type="button">remover</button></div></div>';
      }
      if (emp.status === 'clocked-in') {
        return '<div class="ticket clocked-in" data-id="' + emp.id + '">' +
          '<div class="left"><div class="name">' + tipoBadge(emp) + esc(emp.name) + '</div>' +
          '<div class="meta">' + idLine(emp) + ' · Entrada ' + emp.entradaTime + '</div></div>' +
          '<button class="btn-out" data-action="clock-out" data-id="' + emp.id + '" type="button">Confirmar saída</button></div>';
      }
      if (emp.status === 'confirming-out') {
        return '<div class="ticket confirming" data-id="' + emp.id + '">' +
          '<div class="left"><div class="name">' + tipoBadge(emp) + esc(emp.name) + '</div><div class="meta">Confirmar saída agora (' + timeNow() + ')?</div></div>' +
          '<div class="done-actions"><button class="btn-register" data-action="finish-out" data-id="' + emp.id + '" type="button">Confirmar</button>' +
          '<button class="btn-cancel" data-action="cancel-out" data-id="' + emp.id + '" type="button">cancelar</button></div></div>';
      }
      if (emp.status === 'confirming-in') {
        if (!emp.tipo) {
          return '<div class="ticket confirming" data-id="' + emp.id + '">' +
            '<div class="left"><div class="name">' + esc(emp.name) + '</div><div class="meta">Selecione o tipo</div></div>' + tipoChoiceHTML(emp.id) + '</div>';
        }
        return '<div class="ticket confirming" data-id="' + emp.id + '">' +
          '<div class="left"><div class="name">' + tipoBadge(emp) + esc(emp.name) + '</div><div class="meta">Complete os dados para registrar entrada</div></div>' +
          '<form class="confirming-form" data-action="register" data-id="' + emp.id + '">' + registerFieldsHTML(emp.tipo) +
          '<button type="submit" class="btn-register">Registrar</button></form>' +
          '<button class="btn-cancel" data-action="cancel" data-id="' + emp.id + '" type="button">cancelar</button></div>';
      }
      return '<div class="ticket pending" data-id="' + emp.id + '">' +
        '<div class="left"><div class="name">' + esc(emp.name) + '</div><div class="meta status-pending">Aguardando confirmação</div></div>' +
        '<button class="btn-confirm" data-action="confirm" data-id="' + emp.id + '" type="button">Confirmar entrada</button>' +
        '<button class="remove-link" data-action="remove" data-id="' + emp.id + '" type="button">remover</button></div>';
    }).join('');
  }

  function render() {
    document.getElementById('subtitle-a').textContent = dateLabel();
    var visible = state.employees.filter(matchesFilters);
    document.getElementById('list').innerHTML = renderListHTML(visible);
    document.getElementById('stats').innerHTML = renderStatsHTML(computeStats(visible));
    var btns = document.querySelectorAll('#filters .filter-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-filter') === filter);
    var tbtns = document.querySelectorAll('#tipo-filters .filter-btn');
    for (var k = 0; k < tbtns.length; k++) tbtns[k].classList.toggle('active', tbtns[k].getAttribute('data-tipofilter') === tipoFilter);
    var pbtns = document.querySelectorAll('#period-filters .filter-btn');
    for (var j = 0; j < pbtns.length; j++) pbtns[j].classList.toggle('active', pbtns[j].getAttribute('data-period') === periodFilter && !specificDate);
    var activeCount = (filter !== 'all' ? 1 : 0) + (tipoFilter !== 'all' ? 1 : 0) + (periodFilter !== 'all' || specificDate ? 1 : 0) + (search ? 1 : 0);
    var countEl = document.getElementById('filter-count');
    if (activeCount > 0) { countEl.textContent = activeCount; countEl.style.display = 'inline-block'; } else countEl.style.display = 'none';
  }

  document.getElementById('download-date-input').value = todayISO();

  document.getElementById('add-btn').addEventListener('click', function () {
    var input = document.getElementById('new-name');
    var name = input.value.trim();
    if (!name) return;
    state.employees.push({ id: newId(), tipo: null, name: name, matricula: '', empresa: '', cpf: '', status: 'pending', entradaTime: '', saidaTime: '', date: todayISO() });
    input.value = ''; render(); persist();
  });
  document.getElementById('new-name').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('add-btn').click(); });

  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var id = Number(btn.getAttribute('data-id'));
    var emp = state.employees.find(function (x) { return x.id === id; });
    if (!emp) return;
    if (action === 'set-tipo') { emp.tipo = btn.getAttribute('data-tipo'); render(); }
    else if (action === 'confirm') { emp.status = 'confirming-in'; render(); }
    else if (action === 'cancel') { emp.status = 'pending'; emp.tipo = null; render(); }
    else if (action === 'clock-out') { emp.status = 'confirming-out'; render(); }
    else if (action === 'finish-out') { emp.saidaTime = timeNow(); emp.status = 'done'; render(); persist(); }
    else if (action === 'cancel-out') { emp.status = 'clocked-in'; render(); }
    else if (action === 'remove') { state.employees = state.employees.filter(function (x) { return x.id !== id; }); render(); persist(); }
    else if (action === 'edit') { emp.status = 'editing'; render(); }
    else if (action === 'cancel-edit') { emp.status = 'done'; render(); }
  });

  document.getElementById('filter-toggle').addEventListener('click', function (e) { e.stopPropagation(); document.getElementById('download-panel').classList.remove('open'); document.getElementById('filter-panel').classList.toggle('open'); });
  document.getElementById('download-toggle').addEventListener('click', function (e) { e.stopPropagation(); document.getElementById('filter-panel').classList.remove('open'); document.getElementById('download-panel').classList.toggle('open'); });
  document.addEventListener('click', function (e) {
    var panel = document.getElementById('filter-panel'), toggle = document.getElementById('filter-toggle');
    if (panel.classList.contains('open') && !panel.contains(e.target) && !toggle.contains(e.target)) panel.classList.remove('open');
    var dPanel = document.getElementById('download-panel'), dToggle = document.getElementById('download-toggle');
    if (dPanel.classList.contains('open') && !dPanel.contains(e.target) && !dToggle.contains(e.target)) dPanel.classList.remove('open');
  });

  function csvEscape(c) { c = String(c == null ? '' : c); return /[",\n;]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }
  var STATUS_LABELS = { pending:'Pendente', 'confirming-in':'Confirmando entrada', 'clocked-in':'Aguardando saída', 'confirming-out':'Confirmando saída', done:'Concluído', editing:'Editando' };
  function buildCSV(dateStr) {
    var rows = [['Nome','Tipo','Matrícula','Empresa','CPF','Status','Entrada','Saída']];
    state.employees.filter(function (e) { return e.date === dateStr; }).forEach(function (e) {
      rows.push([e.name, e.tipo === 'tenda' ? 'Tenda' : e.tipo === 'parceiro' ? 'Parceiro' : '', e.matricula || '', e.empresa || '', e.cpf || '', STATUS_LABELS[e.status] || e.status, e.entradaTime || '', e.saidaTime || '']);
    });
    return rows.map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
  }
  function downloadCSV(dateStr) {
    var blob = new Blob(['\uFEFF' + buildCSV(dateStr)], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'ponto-' + dateStr + '.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  document.getElementById('download-confirm').addEventListener('click', function () {
    downloadCSV(document.getElementById('download-date-input').value || todayISO());
    document.getElementById('download-panel').classList.remove('open');
  });

  document.getElementById('search-input').addEventListener('input', function (e) { search = e.target.value.trim(); render(); });
  document.getElementById('filters').addEventListener('click', function (e) { var b = e.target.closest('[data-filter]'); if (!b) return; filter = b.getAttribute('data-filter'); render(); });
  document.getElementById('tipo-filters').addEventListener('click', function (e) { var b = e.target.closest('[data-tipofilter]'); if (!b) return; tipoFilter = b.getAttribute('data-tipofilter'); render(); });
  document.getElementById('period-filters').addEventListener('click', function (e) { var b = e.target.closest('[data-period]'); if (!b) return; periodFilter = b.getAttribute('data-period'); specificDate = ''; document.getElementById('date-input').value = ''; render(); });
  document.getElementById('date-input').addEventListener('change', function (e) { specificDate = e.target.value; render(); });
  document.getElementById('date-clear').addEventListener('click', function () { specificDate = ''; document.getElementById('date-input').value = ''; render(); });

  document.getElementById('list').addEventListener('submit', function (e) {
    var form = e.target.closest('[data-action="register"]');
    if (form) {
      e.preventDefault();
      var id = Number(form.getAttribute('data-id'));
      var emp = state.employees.find(function (x) { return x.id === id; });
      if (!emp) return;
      if (emp.tipo === 'tenda') {
        var matricula = form.querySelector('input[name="matricula"]').value.trim();
        if (!matricula) return;
        emp.matricula = matricula;
      } else {
        var empresa = form.querySelector('input[name="empresa"]').value.trim();
        var cpf = form.querySelector('input[name="cpf"]').value.trim();
        if (!empresa || !validCPF(cpf)) { alert('Informe a empresa e um CPF válido.'); return; }
        emp.empresa = empresa; emp.cpf = cpf;
      }
      emp.entradaTime = timeNow(); emp.status = 'clocked-in'; render(); persist(); return;
    }
    var eform = e.target.closest('[data-action="save-edit"]');
    if (eform) {
      e.preventDefault();
      var id2 = Number(eform.getAttribute('data-id'));
      var emp2 = state.employees.find(function (x) { return x.id === id2; });
      if (!emp2) return;
      var name = eform.querySelector('input[name="name"]').value.trim();
      var entradaTime = eform.querySelector('input[name="entradaTime"]').value.trim();
      var saidaTime = eform.querySelector('input[name="saidaTime"]').value.trim();
      if (!name || !isValidTime(entradaTime) || !isValidTime(saidaTime)) return;
      if (emp2.tipo === 'tenda') {
        var mat = eform.querySelector('input[name="matricula"]').value.trim();
        if (!mat) return;
        emp2.matricula = mat;
      } else {
        var emp3 = eform.querySelector('input[name="empresa"]').value.trim();
        var cpf3 = eform.querySelector('input[name="cpf"]').value.trim();
        if (!emp3 || !validCPF(cpf3)) { alert('Informe a empresa e um CPF válido.'); return; }
        emp2.empresa = emp3; emp2.cpf = cpf3;
      }
      emp2.name = name; emp2.entradaTime = entradaTime; emp2.saidaTime = saidaTime; emp2.status = 'done';
      render(); persist();
    }
  });

  function setMode(mode) {
    appMode = mode;
    if (mode === 'user') adminToken = null;
    document.getElementById('view-usuario').style.display = appMode === 'user' ? 'block' : 'none';
    document.getElementById('view-admin').style.display = appMode === 'admin' ? 'block' : 'none';
    document.getElementById('mode-switch').textContent = appMode === 'user' ? 'Área administrativa' : 'Voltar ao totem';
    if (appMode === 'admin') { render(); pull(); }
  }
  document.getElementById('mode-switch').addEventListener('click', function () {
    if (appMode === 'admin') { setMode('user'); return; }
    var pwd = prompt('Senha da área administrativa:');
    if (pwd === null) return;
    fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); })
      .then(function (x) {
        if (x.status === 429) { alert('Muitas tentativas. Aguarde alguns minutos.'); return; }
        if (x.status !== 200) { alert('Senha incorreta.'); return; }
        adminToken = x.j.token;
        setMode('admin');
      })
      .catch(function () { alert('Sem conexão com o servidor.'); });
  });

  var deferredPrompt = null;
  var installBtn = document.getElementById('install-btn');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; installBtn.style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function () { installBtn.style.display = 'none'; deferredPrompt = null; });
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) installBtn.style.display = 'none';
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });

  renderKiosk();
  pull();
  setInterval(pull, 8000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
  window.addEventListener('online', pull);
})();
</script>
</body>
</html>
