<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponto Lanchonete</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1930">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0E1930;--surface:#15233F;--surface-2:#1D2F52;--line:#2A3D64;--text:#F1F4FA;--text-muted:#8F9DB8;
    --accent:#6C9CFF;--on-accent:#0B1428;--sage:#7FC4A0;--rust:#E39A5B;--info:#5CC8D7;--danger:#E0707A;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  * { box-sizing:border-box; }
  html { background:radial-gradient(900px 480px at 50% -120px,#1F356B 0%,rgba(31,53,107,0) 70%),var(--bg); background-attachment:fixed; }
  html, body { height:100%; margin:0; color:var(--text); font-family:'Work Sans',system-ui,sans-serif; }
  body { background:transparent; display:flex; justify-content:center; padding:32px 16px 48px; }
  .board { width:100%; max-width:520px; }
  header { text-align:center; margin-bottom:22px; }
  .logo { display:block; margin:0 auto 10px; width:72px; height:72px; border-radius:16px; }
  h1 { font-family:'Oswald',sans-serif; font-weight:700; font-size:30px; letter-spacing:.5px; margin:0 0 4px; }
  .subtitle { font-size:14px; color:var(--text-muted); }
  .add-row { display:flex; gap:8px; margin-bottom:16px; }
  input[type="text"], input[type="date"] {
    background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px 14px;
    color:var(--text); font-family:'Work Sans',sans-serif; font-size:15px; outline:none; min-width:0; width:100%;
  }
  .add-row input[type="text"] { flex:1; width:auto; }
  input:focus { border-color:var(--accent); }
  input::placeholder { color:var(--text-muted); }
  input[type="date"] { color-scheme:dark; }
  button { font-family:'Work Sans',sans-serif; font-weight:600; font-size:14px; border:none; border-radius:6px; padding:12px 16px; cursor:pointer; white-space:nowrap; }
  .btn-add { background:var(--accent); color:var(--on-accent); }
  .btn-add:hover { filter:brightness(1.08); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .stat-card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 8px; text-align:center; }
  .stat-card .value { font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; color:var(--accent); }
  .stat-card .label { font-size:10.5px; color:var(--text-muted); margin-top:2px; line-height:1.2; }
  .action-bar { display:flex; gap:8px; margin-bottom:16px; }
  .filter-bar { position:relative; flex:1; min-width:0; }
  .btn-filter { display:flex; align-items:center; gap:8px; background:var(--surface); color:var(--text); border:1px solid var(--line); width:100%; justify-content:space-between; }
  .btn-filter:hover { border-color:var(--accent); }
  .btn-filter .count { background:var(--accent); color:var(--on-accent); border-radius:999px; font-size:11px; padding:2px 7px; font-weight:700; }
  .filter-panel { display:none; position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px; z-index:10; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .filter-panel.open { display:block; }
  .filter-group { margin-bottom:14px; }
  .filter-group:last-child { margin-bottom:0; }
  .filter-group-label { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:8px; display:block; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; }
  .filter-btn { background:var(--surface-2); color:var(--text-muted); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; flex-shrink:0; }
  .filter-btn:hover { color:var(--text); }
  .filter-btn.active { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  .filter-date-row { display:flex; align-items:center; gap:8px; }
  .link-clear { background:transparent; color:var(--text-muted); font-size:12px; text-decoration:underline; padding:4px 2px; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .ticket { background:var(--surface); border-radius:4px; border-left:4px solid var(--line); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .ticket.pending { border-left-color:var(--accent); }
  .ticket.confirming { border-left-color:var(--rust); background:var(--surface-2); }
  .ticket.clocked-in { border-left-color:var(--info); }
  .ticket.done { border-left-color:var(--sage); }
  .ticket .name { font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; }
  .ticket .meta { font-size:13px; color:var(--text-muted); margin-top:2px; }
  .ticket .left { min-width:0; }
  .status-pending { font-size:13px; color:var(--text-muted); }
  .btn-confirm { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .btn-out { background:transparent; color:var(--info); border:1px solid var(--info); }
  .confirming-form, .editing-form { display:flex; flex-wrap:wrap; gap:8px; width:100%; margin-top:4px; }
  .btn-register { background:var(--rust); color:var(--on-accent); }
  .btn-cancel { background:transparent; color:var(--text-muted); font-size:13px; padding:4px 6px; text-decoration:underline; }
  .done-badge { font-size:14px; color:var(--sage); font-weight:600; }
  .done-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .remove-link, .edit-link { background:transparent; font-size:12px; padding:4px 2px; text-decoration:underline; }
  .remove-link { color:var(--text-muted); }
  .edit-link { color:var(--sage); }
  .editing-form input { flex:1; min-width:90px; }
  .editing-form .field-label { font-size:11px; color:var(--text-muted); margin-bottom:3px; display:block; }
  .editing-form .field { display:flex; flex-direction:column; flex:1; min-width:90px; }
  .editing-form .form-actions { display:flex; gap:8px; width:100%; }
  .btn-save { background:var(--sage); color:var(--on-accent); }
  .empty { text-align:center; color:var(--text-muted); font-size:14px; padding:40px 12px; border:1px dashed var(--line); border-radius:6px; }
  .tipo-badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.4px; padding:2px 6px; border-radius:4px; margin-right:6px; font-weight:700; }
  .tipo-badge.tenda { background:rgba(127,196,160,.16); color:var(--sage); }
  .tipo-badge.parceiro { background:rgba(92,200,215,.16); color:var(--info); }
  .tipo-choice-row { display:flex; gap:8px; width:100%; margin-top:4px; }
  .tipo-choice-row button { flex:1; background:var(--surface); color:var(--text); border:1px solid var(--line); }
  .tipo-choice-row button:hover { border-color:var(--accent); color:var(--accent); }
  .mode-switch { position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; font-size:12px; color:var(--text-muted); text-decoration:underline; background:transparent; border:none; cursor:pointer; padding:6px; }
  .install-btn { display:none; position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:12px; font-size:12px; font-weight:700; background:var(--accent); color:var(--on-accent); border:none; border-radius:6px; padding:8px 12px; cursor:pointer; z-index:20; }

  .board.wide { max-width:1100px; }
  .rf-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .rf-period { font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:8px; }
  .rf-period input { width:auto; padding:8px 10px; }
  .rf-hint { font-size:11.5px; color:var(--text-muted); }
  #rf-toolbar input { flex:1; }
  .rf-scroll { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  .rf-table { border-collapse:separate; border-spacing:0; font-size:12px; width:max-content; min-width:100%; }
  .rf-table th, .rf-table td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:0; text-align:center; }
  .rf-table thead th { position:sticky; top:0; background:var(--surface-2); z-index:3; padding:6px 0; min-width:34px; font-weight:600; }
  .rf-table thead th small { display:block; font-weight:400; color:var(--text-muted); font-size:10px; }
  .rf-table th.wk { color:var(--rust); }
  .rf-table .rf-name { position:sticky; left:0; z-index:2; background:var(--surface); text-align:left; padding:6px 10px; min-width:190px; max-width:230px; }
  .rf-table thead .rf-name { z-index:4; background:var(--surface-2); }
  .rf-n { font-weight:600; font-size:12.5px; }
  .rf-sub { color:var(--text-muted); font-size:10.5px; }
  .rf-name .edit-link { font-size:11px; padding:2px 0; }
  .rf-cell { cursor:pointer; height:34px; user-select:none; color:var(--on-accent); }
  .rf-cell:hover { background:var(--surface-2); }
  .rf-cell.on { background:var(--accent); font-weight:700; }
  .rf-cell.wk:not(.on) { background:rgba(255,255,255,.03); }
  .rf-tot { min-width:46px; font-weight:700; color:var(--accent); background:var(--surface-2); position:sticky; right:0; z-index:1; }
  .rf-table tfoot td { position:sticky; bottom:0; background:var(--surface-2); font-weight:700; padding:7px 0; z-index:2; }
  .rf-table tfoot .rf-name { z-index:5; }
  .rf-form { background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; display:flex; flex-wrap:wrap; gap:8px; }
  .rf-form .field { display:flex; flex-direction:column; flex:1; min-width:140px; }
  .rf-form .field-label { font-size:11px; color:var(--text-muted); margin-bottom:3px; }
  .rf-form .form-actions { display:flex; gap:8px; width:100%; align-items:center; }
  .btn-danger { background:transparent; color:var(--danger); border:1px solid var(--danger); margin-left:auto; }
  .rf-bars { display:flex; flex-direction:column; gap:10px; margin:14px 0 22px; }
  .rf-bar-row { display:grid; grid-template-columns:110px 1fr 56px; gap:10px; align-items:center; font-size:13px; }
  .rf-bar-track { background:var(--surface); border:1px solid var(--line); border-radius:6px; height:20px; overflow:hidden; }
  .rf-bar-fill { height:100%; border-radius:5px; }
  .rf-bar-row b { text-align:right; font-family:'Oswald',sans-serif; }
  .rf-chart-title { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin:6px 0 8px; }
  .rf-chart { display:flex; align-items:flex-end; gap:3px; height:160px; padding:8px 8px 0; background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow-x:auto; }
  .rf-col { flex:1; min-width:14px; display:flex; flex-direction:column; justify-content:flex-end; height:100%; align-items:stretch; }
  .rf-seg { width:100%; }
  .rf-axis { display:flex; gap:3px; padding:4px 8px 0; font-size:9px; color:var(--text-muted); overflow-x:auto; }
  .rf-axis span { flex:1; min-width:14px; text-align:center; }
  .rf-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; margin-top:10px; color:var(--text-muted); }
  .rf-legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .kiosk { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:55vh; gap:18px; text-align:center; }
  .kiosk-sub { color:var(--text-muted); font-size:15px; }
  .kiosk-choices { display:flex; gap:14px; width:100%; max-width:380px; }
  .kiosk-choice { flex:1; padding:30px 10px; font-size:18px; font-weight:700; font-family:'Oswald',sans-serif; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:10px; }
  .kiosk-choice:hover { border-color:var(--accent); color:var(--accent); }
  .kiosk-form { display:flex; flex-direction:column; gap:10px; width:100%; max-width:380px; }
  .kiosk-form .btn-add, .kiosk .btn-add { width:100%; }
</style>
</head>
<body>
<button class="mode-switch" id="mode-switch" type="button">Área administrativa</button>
<button class="install-btn" id="install-btn" type="button">📲 Instalar app</button>
<div class="board">

  <div id="view-usuario">
    <header><img class="logo" src="logo-tenda.png" alt="Tenda Atacado" width="72" height="72"><h1>Ponto Lanchonete</h1><div class="subtitle" id="subtitle-u"></div></header>
    <div class="kiosk" id="kiosk"></div>
  </div>

  <div id="view-admin" style="display:none;">
    <header><img class="logo" src="logo-tenda.png" alt="Tenda Atacado" width="72" height="72"><h1>Ponto Lanchonete</h1><div class="subtitle" id="subtitle-a"></div></header>
    <div class="filters" id="admin-tabs" style="justify-content:center;margin-bottom:16px;">
      <button class="filter-btn active" data-tab="ponto" type="button">Ponto</button>
      <button class="filter-btn" data-tab="refeicao" type="button">Controle de refeição</button>
    </div>
    <div id="admin-ponto">
    <div class="add-row">
      <input type="text" id="new-name" placeholder="Nome do funcionário" maxlength="60">
      <button class="btn-add" id="add-btn">Adicionar</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="action-bar">
      <div class="filter-bar">
        <button class="btn-filter" id="filter-toggle" type="button"><span>🔎 Filtrar</span><span class="count" id="filter-count" style="display:none;"></span></button>
        <div class="filter-panel" id="filter-panel">
          <div class="filter-group"><span class="filter-group-label">Buscar</span><input type="text" id="search-input" placeholder="Nome, matrícula, empresa ou CPF"></div>
          <div class="filter-group"><span class="filter-group-label">Tipo</span>
            <div class="filters" id="tipo-filters">
              <button class="filter-btn active" data-tipofilter="all" type="button">Todos</button>
              <button class="filter-btn" data-tipofilter="tenda" type="button">Tenda</button>
              <button class="filter-btn" data-tipofilter="parceiro" type="button">Parceiro</button>
            </div>
          </div>
          <div class="filter-group"><span class="filter-group-label">Status</span>
            <div class="filters" id="filters">
              <button class="filter-btn active" data-filter="all" type="button">Todos</button>
              <button class="filter-btn" data-filter="pending" type="button">Pendentes</button>
              <button class="filter-btn" data-filter="clocked-in" type="button">Aguardando saída</button>
              <button class="filter-btn" data-filter="done" type="button">Concluídos</button>
            </div>
          </div>
          <div class="filter-group"><span class="filter-group-label">Período</span>
            <div class="filters" id="period-filters" style="margin-bottom:8px;">
              <button class="filter-btn active" data-period="all" type="button">Todo período</button>
              <button class="filter-btn" data-period="week" type="button">Esta semana</button>
              <button class="filter-btn" data-period="month" type="button">Este mês</button>
            </div>
            <div class="filter-date-row"><input type="date" id="date-input"><button class="link-clear" id="date-clear" type="button">limpar data</button></div>
          </div>
        </div>
      </div>
      <div class="filter-bar">
        <button class="btn-filter" id="download-toggle" type="button"><span>⬇️ Baixar lista</span></button>
        <div class="filter-panel" id="download-panel">
          <div class="filter-group"><span class="filter-group-label">Escolha o dia</span><input type="date" id="download-date-input"></div>
          <button class="btn-add" id="download-confirm" type="button" style="width:100%;">Baixar CSV</button>
        </div>
      </div>
    </div>
    <div class="list" id="list"></div>
    </div>

    <div id="admin-refeicao" style="display:none;">
      <div class="filters" id="rf-grupos" style="margin-bottom:12px;"></div>
      <div class="rf-bar">
        <label class="rf-period"><button class="btn-cancel" id="rf-prev" type="button" title="Período anterior">‹</button> Início do período <input type="date" id="rf-inicio"> <button class="btn-cancel" id="rf-next" type="button" title="Próximo período">›</button></label>
        <span class="rf-hint">30 dias · toque na célula para marcar/desmarcar</span>
      </div>
      <div class="rf-bar" id="rf-toolbar" style="display:none;">
        <input type="text" id="rf-search" placeholder="Buscar nome ou matrícula">
        <button class="btn-add" id="rf-add" type="button">+ Pessoa</button>
      </div>
      <div id="rf-form"></div>
      <div id="rf-body"><div class="empty">Carregando…</div></div>
    </div>
  </div>

</div>

<script>
(function () {
  var STORAGE_KEY = 'ponto-do-turno-state';
  var state = { employees: [], nextId: 1 };
  var appMode = 'user';
  var filter = 'all', periodFilter = 'all', specificDate = '', search = '', tipoFilter = 'all';
  var kioskState = { step: 'type', tipo: null, msg: '' };

  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      state.employees = parsed.employees || [];
      state.nextId = parsed.nextId || 1;
    }
  } catch (e) {}

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function timeNow() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dateISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return dateISO(new Date()); }
  function parseISO(s) { var p = s.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
  function isThisWeek(s) { if (!s) return true; var d = parseISO(s), now = new Date(); var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()); var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7); return d >= start && d < end; }
  function isThisMonth(s) { if (!s) return true; var d = parseISO(s), now = new Date(); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }
  function isValidTime(t) { return /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(t); }
  function dateLabel() {
    var d = new Date();
    var dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    var meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return dias[d.getDay()] + ', ' + d.getDate() + ' de ' + meses[d.getMonth()];
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function maskCPF(v) {
    v = v.replace(/\D/g, '').slice(0, 11);
    if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
    else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
    return v;
  }
  function validCPF(v) { var d = String(v || '').replace(/\D/g, ''); return d.length === 11 && !/^(\d)\1{10}$/.test(d); }
  function idLine(emp) {
    if (emp.tipo === 'tenda') return 'Matrícula ' + esc(emp.matricula);
    if (emp.tipo === 'parceiro') return esc(emp.empresa) + ' · CPF ' + esc(emp.cpf);
    return '';
  }
  function tipoBadge(emp) {
    if (!emp.tipo) return '';
    return '<span class="tipo-badge ' + emp.tipo + '">' + (emp.tipo === 'tenda' ? 'Tenda' : 'Parceiro') + '</span>';
  }
  /* ---------- Sincronização com o servidor (Neon) ---------- */
  var SYNC_KEY = 'ponto-do-turno-synced';
  var TRANSIENT = { 'confirming-in': 1, 'confirming-out': 1, 'editing': 1 };
  var synced = {}, syncing = false, syncAgain = false, ver = 0;
  try { synced = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') || {}; } catch (e) {}

  function newId() { return Date.now() * 1000 + Math.floor(Math.random() * 1000); }
  function norm(e) {
    var s = e.status;
    if (s === 'confirming-in') s = 'pending'; else if (s === 'confirming-out') s = 'clocked-in'; else if (s === 'editing') s = 'done';
    return { id: e.id, tipo: e.tipo || null, name: e.name, matricula: e.matricula || '', empresa: e.empresa || '', cpf: e.cpf || '', status: s, entradaTime: e.entradaTime || '', saidaTime: e.saidaTime || '', date: e.date };
  }
  function isDirty(e) { return JSON.stringify(norm(e)) !== synced[e.id]; }
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); localStorage.setItem(SYNC_KEY, JSON.stringify(synced)); } catch (e) {}
  }
  var adminToken = null;
  function api(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'x-admin-token': adminToken || '' });
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { setMode('user'); alert('Sessão expirada. Entre novamente na área administrativa.'); throw new Error('auth'); }
      return r;
    });
  }
  function checkOk(r) { if (!r.ok) throw new Error('http ' + r.status); }

  function sync() {
    if (!adminToken) return;
    if (syncing) { syncAgain = true; return; }
    var ops = [], present = {};
    state.employees.forEach(function (e) {
      present[e.id] = 1;
      var j = JSON.stringify(norm(e));
      if (synced[e.id] !== j) {
        ops.push(api('/api/employees/' + e.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: j })
          .then(checkOk).then(function () { synced[e.id] = j; }));
      }
    });
    Object.keys(synced).forEach(function (id) {
      if (!present[id]) ops.push(api('/api/employees/' + id, { method: 'DELETE' }).then(checkOk).then(function () { delete synced[id]; }));
    });
    if (!ops.length) return;
    syncing = true;
    Promise.all(ops.map(function (p) { return p.catch(function () {}); })).then(function () {
      syncing = false; saveLocal();
      if (syncAgain) { syncAgain = false; sync(); }
    });
  }

  function editingInList() {
    var a = document.activeElement;
    return state.employees.some(function (e) { return TRANSIENT[e.status]; }) || (a && a.closest && a.closest('#list'));
  }

  function pull() {
    if (syncing || !adminToken) return;
    var v = ver;
    api('/api/employees', { cache: 'no-store' }).then(function (r) { checkOk(r); return r.json(); }).then(function (list) {
      if (v !== ver || syncing) return;
      var local = {}, serverIds = {}, next = [];
      state.employees.forEach(function (e) { local[e.id] = e; });
      list.forEach(function (s) {
        serverIds[s.id] = 1;
        var l = local[s.id];
        if (l && (TRANSIENT[l.status] || isDirty(l))) { next.push(l); }
        else { next.push(s); synced[s.id] = JSON.stringify(norm(s)); }
      });
      state.employees.forEach(function (e) {
        if (!serverIds[e.id]) { if (isDirty(e) || TRANSIENT[e.status]) next.push(e); else delete synced[e.id]; }
      });
      next.sort(function (a, b) { return a.id - b.id; });
      var changed = JSON.stringify(next) !== JSON.stringify(state.employees);
      state.employees = next;
      saveLocal();
      if (changed && appMode === 'admin' && !editingInList()) render();
      sync();
    }).catch(function () {});
  }

  function persist() { ver++; saveLocal(); sync(); }

      .then(function (r) {
        if (r.status === 404) { var er = new Error('matricula'); er.notFound = true; throw er; }
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function (j) { kioskState.msg = j.msg; kioskState.step = 'success'; renderKiosk(); })
      .catch(function (er) {

  function matchesFilters(emp) {

    if (filter !== 'all') {
      var m = filter === 'pending' ? (emp.status === 'pending' || emp.status === 'confirming-in') :
        filter === 'clocked-in' ? (emp.status === 'clocked-in' || emp.status === 'confirming-out') :
        filter === 'done' ? (emp.status === 'done' || emp.status === 'editing') : true;

    if (specificDate) { if (emp.date !== specificDate) return false; }
    else { if (periodFilter === 'week' && !isThisWeek(emp.date)) return false; if (periodFilter === 'month' && !isThisMonth(emp.date)) return false; }
    if (search) {
      var q = search.toLowerCase();
      var hit = emp.name.toLowerCase().indexOf(q) !== -1 || (emp.matricula || '').toLowerCase().indexOf(q) !== -1 ||
        (emp.empresa || '').toLowerCase().indexOf(q) !== -1 || (emp.cpf || '').toLowerCase().indexOf(q) !== -1;
      if (!hit) return false;

  function csvEscape(c) { c = String(c == null ? '' : c); return /[",\n;]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }
  var STATUS_LABELS = { pending:'Pendente', 'confirming-in':'Confirmando entrada', 'clocked-in':'Aguardando saída', 'confirming-out':'Confirmando saída', done:'Concluído', editing:'Editando' };
  function buildCSV(dateStr) {
    var rows = [['Nome','Tipo','Matrícula','Empresa','CPF','Status','Entrada','Saída']];
    state.employees.filter(function (e) { return e.date === dateStr; }).forEach(function (e) {
      rows.push([e.name, e.tipo === 'tenda' ? 'Tenda' : e.tipo === 'parceiro' ? 'Parceiro' : '', e.matricula || '', e.empresa || '', e.cpf || '', STATUS_LABELS[e.status] || e.status, e.entradaTime || '', e.saidaTime || '']);
    });
    return rows.map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
  }
  function downloadCSV(dateStr) {

    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'ponto-' + dateStr + '.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; installBtn.style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function () { installBtn.style.display = 'none'; deferredPrompt = null; });
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) installBtn.style.display = 'none';
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });


  /* ---------- Controle de refeição (aba do admin) ---------- */
  var RF_GRUPOS = [['resumo', 'Resumo'], ['diretoria', 'Diretoria'], ['colaboradores', 'Colaboradores'], ['conselho', 'Conselho'], ['securitizadora', 'Securitizadora'], ['parceiros', 'Parceiros']];
  var RF_NOMES = { diretoria: 'Diretoria', colaboradores: 'Colaboradores', conselho: 'Conselho', securitizadora: 'Securitizadora', parceiros: 'Parceiros' };
  var RF_CORES = { diretoria: 'var(--accent)', colaboradores: 'var(--info)', conselho: 'var(--rust)', securitizadora: 'var(--sage)', parceiros: '#B58CF0' };
  var DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var rf = { grupo: 'resumo', inicio: '', pessoas: [], loaded: false, search: '', editing: null };

  function rfDays() {
    var out = [], d = parseISO(rf.inicio);
    for (var i = 0; i < 30; i++) out.push(dateISO(new Date(d.getFullYear(), d.getMonth(), d.getDate() + i)));
    return out;
  }
  function rfSum(p) { var t = 0; for (var k in p.marcas) t += p.marcas[k]; return t; }
  function rfGroup(g) { return rf.pessoas.filter(function (p) { return p.grupo === g; }); }
  function rfGroupTotal(g) { return rfGroup(g).reduce(function (a, p) { return a + rfSum(p); }, 0); }
  function rfDayTotal(g, dia) { return rfGroup(g).reduce(function (a, p) { return a + (p.marcas[dia] || 0); }, 0); }
  function dayShort(iso) { var d = parseISO(iso); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }

  function rfLoad() {
    api('/api/refeicao' + (rf.inicio ? '?inicio=' + rf.inicio : ''), { cache: 'no-store' })
      .then(function (r) { checkOk(r); return r.json(); })
      .then(function (j) {
        rf.inicio = j.inicio; rf.pessoas = j.pessoas; rf.loaded = true;
        document.getElementById('rf-inicio').value = rf.inicio;
        rfRender();
      })
      .catch(function (e) { if (e.message !== 'auth') document.getElementById('rf-body').innerHTML = '<div class="empty">Não foi possível carregar. Verifique a conexão.</div>'; });
  }

  function rfRenderTabs() {
    document.getElementById('rf-grupos').innerHTML = RF_GRUPOS.map(function (g) {
      return '<button class="filter-btn' + (rf.grupo === g[0] ? ' active' : '') + '" data-grupo="' + g[0] + '" type="button">' + g[1] + '</button>';
    }).join('');
    document.getElementById('rf-toolbar').style.display = rf.grupo === 'resumo' ? 'none' : 'flex';
  }

  function rfRenderResumo() {
    var gs = ['conselho', 'diretoria', 'colaboradores', 'securitizadora'];
    var tot = {}; gs.forEach(function (g) { tot[g] = rfGroupTotal(g); });
    var principal = tot.conselho + tot.diretoria + tot.colaboradores, geral = principal + tot.securitizadora;
    var max = Math.max(1, tot.conselho, tot.diretoria, tot.colaboradores, tot.securitizadora);
    var days = rfDays();
    var dayTot = days.map(function (d) { var o = { d: d, t: 0 }; gs.forEach(function (g) { o[g] = rfDayTotal(g, d); o.t += o[g]; }); return o; });
    var dmax = Math.max(1, Math.max.apply(null, dayTot.map(function (o) { return o.t; })));
    var html = '<div class="stats">' +
      '<div class="stat-card"><div class="value">' + principal + '</div><div class="label">Total principal</div></div>' +
      '<div class="stat-card"><div class="value">' + tot.securitizadora + '</div><div class="label">Securitizadora</div></div>' +
      '<div class="stat-card"><div class="value">' + geral + '</div><div class="label">Total geral</div></div></div>';
    html += '<div class="rf-chart-title">Refeições por grupo · ' + dayShort(days[0]) + ' a ' + dayShort(days[29]) + '</div><div class="rf-bars">' +
      ['diretoria', 'colaboradores', 'conselho', 'securitizadora'].map(function (g) {
        return '<div class="rf-bar-row"><span>' + RF_NOMES[g] + '</span><div class="rf-bar-track"><div class="rf-bar-fill" style="width:' + (tot[g] / max * 100) + '%;background:' + RF_CORES[g] + '"></div></div><b>' + tot[g] + '</b></div>';
      }).join('') + '</div>';
    html += '<div class="rf-chart-title">Refeições por dia</div><div class="rf-chart">' +
      dayTot.map(function (o) {
        var segs = ['diretoria', 'colaboradores', 'conselho', 'securitizadora'].map(function (g) {
          return o[g] ? '<div class="rf-seg" style="height:' + (o[g] / dmax * 100) + '%;background:' + RF_CORES[g] + '" title="' + RF_NOMES[g] + ': ' + o[g] + '"></div>' : '';
        }).join('');
        return '<div class="rf-col" title="' + dayShort(o.d) + ': ' + o.t + '">' + segs + '</div>';
      }).join('') + '</div>' +
      '<div class="rf-axis">' + days.map(function (d) { return '<span>' + parseISO(d).getDate() + '</span>'; }).join('') + '</div>' +
      '<div class="rf-legend">' + ['diretoria', 'colaboradores', 'conselho', 'securitizadora'].map(function (g) { return '<span><i style="background:' + RF_CORES[g] + '"></i>' + RF_NOMES[g] + '</span>'; }).join('') + '</div>';
    return html + rfRenderParceiros(days);
  }

  function rfRenderParceiros(days) {
    var pp = rfGroup('parceiros'), tot = rfGroupTotal('parceiros'), emp = {};
    pp.forEach(function (p) { var k = p.depto || 'Sem empresa'; emp[k] = (emp[k] || 0) + rfSum(p); });
    var lista = Object.keys(emp).map(function (k) { return [k, emp[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
    var max = Math.max(1, lista.length ? lista[0][1] : 1);
    var dt = days.map(function (d) { return rfDayTotal('parceiros', d); });
    var dmax = Math.max(1, Math.max.apply(null, dt));
    var html = '<hr style="border:none;border-top:1px solid var(--line);margin:26px 0 18px;">' +
      '<div class="rf-chart-title" style="color:var(--text);font-size:13px;">Parceiros Tenda · visível só na área administrativa</div>' +
      '<div class="stats">' +
      '<div class="stat-card"><div class="value">' + tot + '</div><div class="label">Refeições</div></div>' +
      '<div class="stat-card"><div class="value">' + pp.length + '</div><div class="label">Parceiros</div></div>' +
      '<div class="stat-card"><div class="value">' + lista.length + '</div><div class="label">Empresas</div></div></div>';
    if (!pp.length) return html + '<div class="empty">Nenhum parceiro registrado ainda. Eles entram aqui automaticamente quando registram entrada no totem.</div>';
    html += '<div class="rf-chart-title">Refeições por empresa</div><div class="rf-bars">' +
      lista.slice(0, 10).map(function (x) {
        return '<div class="rf-bar-row"><span title="' + esc(x[0]) + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(x[0]) + '</span><div class="rf-bar-track"><div class="rf-bar-fill" style="width:' + (x[1] / max * 100) + '%;background:' + RF_CORES.parceiros + '"></div></div><b>' + x[1] + '</b></div>';
      }).join('') + '</div>' +
      '<div class="rf-chart-title">Parceiros por dia</div><div class="rf-chart">' +
      dt.map(function (n, i) {
        return '<div class="rf-col" title="' + dayShort(days[i]) + ': ' + n + '">' + (n ? '<div class="rf-seg" style="height:' + (n / dmax * 100) + '%;background:' + RF_CORES.parceiros + '"></div>' : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="rf-axis">' + days.map(function (d) { return '<span>' + parseISO(d).getDate() + '</span>'; }).join('') + '</div>';
    return html;
  }

  function rfRenderGrid() {
    var days = rfDays(), q = rf.search.toLowerCase();
    var all = rfGroup(rf.grupo);
    var rows = all.filter(function (p) { return !q || p.nome.toLowerCase().indexOf(q) !== -1 || (p.matricula || '').toLowerCase().indexOf(q) !== -1 || (p.cpf || '').indexOf(q) !== -1 || (p.depto || '').toLowerCase().indexOf(q) !== -1; });
    var head = '<th class="rf-name">Nome</th>' + days.map(function (d) {
      var w = parseISO(d).getDay(); var wk = (w === 0 || w === 6) ? ' wk' : '';
      return '<th class="' + wk.trim() + '">' + parseISO(d).getDate() + '<small>' + DOW[w] + '</small></th>';
    }).join('') + '<th class="rf-tot" style="top:0;z-index:4;">Total</th>';
    var body = rows.map(function (p) {
      var sub = [p.matricula, p.depto, p.ccusto, p.cpf].filter(Boolean).map(esc).join(' · ');
      return '<tr data-pid="' + p.id + '"><td class="rf-name"><div class="rf-n">' + esc(p.nome) + '</div><div class="rf-sub">' + sub + '</div>' +
        '<button class="edit-link" data-rf="edit" data-id="' + p.id + '" type="button">editar</button></td>' +
        days.map(function (d) {
          var v = p.marcas[d] || 0, w = parseISO(d).getDay();
          return '<td class="rf-cell' + (v ? ' on' : '') + ((w === 0 || w === 6) ? ' wk' : '') + '" data-rf="cell" data-id="' + p.id + '" data-dia="' + d + '">' + (v || '') + '</td>';
        }).join('') + '<td class="rf-tot">' + rfSum(p) + '</td></tr>';
    }).join('');
    var foot = '<tr><td class="rf-name">TOTAL (' + all.length + ' pessoas)</td>' + days.map(function (d) { return '<td id="rf-ft-' + d + '">' + rfDayTotal(rf.grupo, d) + '</td>'; }).join('') + '<td class="rf-tot" id="rf-ft-all">' + rfGroupTotal(rf.grupo) + '</td></tr>';
    if (!rows.length) return '<div class="empty">Nenhuma pessoa' + (q ? ' nessa busca' : ' neste grupo') + '.</div>';
    return '<div class="rf-scroll"><table class="rf-table"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
  }

  function rfRender() {
    rfRenderTabs();
    document.getElementById('rf-body').innerHTML = rf.grupo === 'resumo' ? rfRenderResumo() : rfRenderGrid();
    rfRenderForm();
  }

  function rfRenderForm() {
    var el = document.getElementById('rf-form');
    if (!rf.editing || rf.grupo === 'resumo') { el.innerHTML = ''; return; }
    var p = rf.editing === 'new' ? { nome: '', matricula: '', depto: '', ccusto: '', cpf: '' } : rf.pessoas.filter(function (x) { return x.id === rf.editing; })[0];
    if (!p) { rf.editing = null; el.innerHTML = ''; return; }
    var lbl = rf.grupo === 'colaboradores' ? 'Periodicidade (FIXO / ESPORÁDICO)' : rf.grupo === 'parceiros' ? 'Empresa' : 'Departamento';
    el.innerHTML = '<form class="rf-form" id="rf-person-form">' +
      '<div class="field" style="flex:2;min-width:200px;"><span class="field-label">Nome</span><input type="text" name="nome" value="' + esc(p.nome) + '" maxlength="80" required></div>' +
      (rf.grupo !== 'conselho' && rf.grupo !== 'parceiros' ? '<div class="field"><span class="field-label">Matrícula</span><input type="text" name="matricula" value="' + esc(p.matricula) + '" maxlength="30"></div>' : '') +
      '<div class="field"><span class="field-label">' + lbl + '</span><input type="text" name="depto" value="' + esc(p.depto) + '" maxlength="60"></div>' +
      (rf.grupo === 'parceiros' ? '<div class="field"><span class="field-label">CPF</span><input type="text" name="cpf" class="cpf-input" value="' + esc(p.cpf) + '" inputmode="numeric" maxlength="14"></div>' : '') +
      (rf.grupo === 'conselho' ? '<div class="field"><span class="field-label">Centro de custo</span><input type="text" name="ccusto" value="' + esc(p.ccusto) + '" maxlength="30"></div>' : '') +
      '<div class="form-actions"><button type="submit" class="btn-save">' + (rf.editing === 'new' ? 'Adicionar' : 'Salvar') + '</button>' +
      '<button type="button" class="btn-cancel" data-rf="cancel">cancelar</button>' +
      (rf.editing === 'new' ? '' : '<button type="button" class="btn-danger" data-rf="delete">Excluir</button>') + '</div></form>';
    var first = el.querySelector('input'); if (first) first.focus();
  }

  function rfToggleCell(td) {
    var id = Number(td.getAttribute('data-id')), dia = td.getAttribute('data-dia');
    var p = rf.pessoas.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    function apply(v) {
      if (v) p.marcas[dia] = v; else delete p.marcas[dia];
      td.textContent = v || ''; td.classList.toggle('on', !!v);
      td.parentNode.querySelector('.rf-tot').textContent = rfSum(p);
      document.getElementById('rf-ft-' + dia).textContent = rfDayTotal(p.grupo, dia);
      document.getElementById('rf-ft-all').textContent = rfGroupTotal(p.grupo);
    }
    var old = p.marcas[dia] || 0, nv = old ? 0 : 1;
    apply(nv);
    api('/api/refeicao/marcas', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pessoa_id: id, dia: dia, qtd: nv }) })
      .then(checkOk)
      .catch(function (e) { apply(old); if (e.message !== 'auth') alert('Não foi possível salvar a marcação. Tente novamente.'); });
  }

  document.getElementById('admin-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    var tab = b.getAttribute('data-tab');
    var btns = document.querySelectorAll('#admin-tabs .filter-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i] === b);
    document.getElementById('admin-ponto').style.display = tab === 'ponto' ? 'block' : 'none';
    document.getElementById('admin-refeicao').style.display = tab === 'refeicao' ? 'block' : 'none';
    document.querySelector('.board').classList.toggle('wide', tab === 'refeicao');
    if (tab === 'refeicao') rfLoad(); else render();
  });
  document.getElementById('rf-grupos').addEventListener('click', function (e) {
    var b = e.target.closest('[data-grupo]'); if (!b) return;
    rf.grupo = b.getAttribute('data-grupo'); rf.editing = null; rf.search = ''; document.getElementById('rf-search').value = '';
    rfRender();
  });
  document.getElementById('rf-inicio').addEventListener('change', function (e) { if (e.target.value) { rf.inicio = e.target.value; rfLoad(); } });
  function rfShift(n) { var d = parseISO(rf.inicio); rf.inicio = dateISO(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)); rfLoad(); }
  document.getElementById('rf-prev').addEventListener('click', function () { rfShift(-30); });
  document.getElementById('rf-next').addEventListener('click', function () { rfShift(30); });
  document.getElementById('rf-search').addEventListener('input', function (e) { rf.search = e.target.value.trim(); document.getElementById('rf-body').innerHTML = rfRenderGrid(); });
  document.getElementById('rf-add').addEventListener('click', function () { rf.editing = 'new'; rfRenderForm(); });

  document.getElementById('admin-refeicao').addEventListener('click', function (e) {
    var t = e.target.closest('[data-rf]'); if (!t) return;
    var a = t.getAttribute('data-rf');
    if (a === 'cell') rfToggleCell(t);
    else if (a === 'edit') { rf.editing = Number(t.getAttribute('data-id')); rfRenderForm(); }
    else if (a === 'cancel') { rf.editing = null; rfRenderForm(); }
    else if (a === 'delete') {
      var p = rf.pessoas.filter(function (x) { return x.id === rf.editing; })[0];
      if (!p || !confirm('Excluir ' + p.nome + ' e todas as marcações dessa pessoa?')) return;
      api('/api/refeicao/pessoas/' + p.id, { method: 'DELETE' }).then(checkOk).then(function () {
        rf.pessoas = rf.pessoas.filter(function (x) { return x.id !== p.id; }); rf.editing = null; rfRender();
      }).catch(function (er) { if (er.message !== 'auth') alert('Não foi possível excluir.'); });
    }
  });

  document.getElementById('admin-refeicao').addEventListener('submit', function (e) {
    var form = e.target.closest('#rf-person-form'); if (!form) return;
    e.preventDefault();
    var isNew = rf.editing === 'new', id = rf.editing;
    var cur = isNew ? { matricula: '', depto: '', ccusto: '', cpf: '' } : (rf.pessoas.filter(function (x) { return x.id === id; })[0] || {});
    function val(n) { var i = form.querySelector('[name="' + n + '"]'); return i ? i.value.trim() : (cur[n] || ''); }
    var body = { grupo: rf.grupo, nome: val('nome'), matricula: val('matricula'), depto: val('depto'), ccusto: val('ccusto'), cpf: val('cpf') };
    if (!body.nome) return;
    if (rf.grupo === 'parceiros' && body.cpf && !validCPF(body.cpf)) { alert('CPF inválido.'); return; }
    api(isNew ? '/api/refeicao/pessoas' : '/api/refeicao/pessoas/' + id, { method: isNew ? 'POST' : 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { checkOk(r); return r.json(); })
      .then(function (j) {
        if (isNew) rf.pessoas.push({ id: j.id, grupo: rf.grupo, nome: body.nome, matricula: body.matricula, depto: body.depto, ccusto: body.ccusto, cpf: body.cpf, marcas: {} });
        else { var p = rf.pessoas.filter(function (x) { return x.id === id; })[0]; if (p) { p.nome = body.nome; p.matricula = body.matricula; p.depto = body.depto; p.ccusto = body.ccusto; p.cpf = body.cpf; } }
        rf.editing = null; rfRender();
      })
      .catch(function (er) { if (er.message !== 'auth') alert('Não foi possível salvar.'); });
  });

  renderKiosk();
  pull();
  setInterval(pull, 8000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
  window.addEventListener('online', pull);
})();
</script>
</body>
</html>
